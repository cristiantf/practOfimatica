<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymTracker SPA</title>
    
    <!-- Theme Color para PWA-like experience -->
    <meta name="theme-color" content="#0a0a0f">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Header -->
    <header class="app-header">
        <h1 class="logo">
            <span class="logo-icon">🏋️</span>
            GymTracker
        </h1>
    </header>

    <!-- Main Content Area (Dynamic Views will be injected here) -->
    <main id="app" class="app-content">
        <!-- Contenido inicial se carga vía JS -->
        <div class="loading-state">
            Cargando...
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="nav-bottom">
        <a href="#/" class="nav-item active" id="nav-dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Inicio</span>
        </a>
        <a href="#/routines" class="nav-item" id="nav-routines">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
            <span>Rutinas</span>
        </a>
        <a href="#/session" class="nav-item nav-item-cta" id="nav-session">
            <div class="cta-inner">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            <span>Entrenar</span>
        </a>
        <a href="#/history" class="nav-item" id="nav-history">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Historial</span>
        </a>
        <a href="#/stats" class="nav-item" id="nav-stats">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 20V10"></path>
                <path d="M12 20V4"></path>
                <path d="M6 20v-6"></path>
            </svg>
            <span>Progreso</span>
        </a>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Modal Container -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal card">
            <div class="modal-header">
                <h3 id="modal-title">Título</h3>
                <button class="btn-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="js/ui.js"></script>
    <script src="js/storage.js"></script>
    
    <!-- Views -->
    <script src="js/views/dashboard.js"></script>
    
    <!-- Main App Router -->
    <script src="js/app.js"></script>
</body>
</html>
